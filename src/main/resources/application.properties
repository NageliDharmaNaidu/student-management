# ==========================================
# Application Config
# ==========================================
spring.application.name=student-management
server.port=8081mvn spring-boot:run

# ==========================================
# MySQL Database Config
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Config
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# AWS Config (update with your credentials)
# ==========================================
aws.region=ap-south-1
aws.s3.bucket-name=student-management-bucket

# ==========================================
# Logging
# ==========================================
logging.level.com.student=DEBUG
logging.level.org.springframework.web=INFO
